<div class="login-container">

  <h2>Admin Login</h2>

  <form (ngSubmit)="login()">

    <label>Email</label>

    <input
      type="email"
      [(ngModel)]="email"
      name="email"
      required
    >

    <label>Password</label>

    <div class="password-container">
      <input
        [type]="showPassword ? 'text' : 'password'"
        [(ngModel)]="password"
        name="password"
        required
      >

      <button
  type="button"
  class="eye-button"
  (click)="showPassword = !showPassword"
>
  <mat-icon>
    {{ showPassword ? 'visibility_off' : 'visibility' }}
  </mat-icon>
</button>
    </div>

    <button type="submit" class="login-button">
      Login
    </button>

    @if (errorMessage) {
      <p class="error-message">
        {{ errorMessage }}
      </p>
    }

  </form>

</div>
